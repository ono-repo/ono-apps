<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ono Apps</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --accent: #2563eb;
      --border: #d1d9e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --accent: #4493f8;
        --border: #30363d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header, footer {
      padding: 16px 24px;
      border-color: var(--border);
    }
    header { border-bottom: 1px solid var(--border); }
    footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Ono Apps</h1>
  </header>

  <main>
    <h2>환영합니다</h2>
    <p>기본 HTML 페이지입니다. 여기에 내용을 추가하세요.</p>
  </main>

  <footer>
    &copy; 2026 Ono Apps
  </footer>

  <script>
    // 스크립트를 여기에 작성하세요.
  </script>
</body>
</html>
